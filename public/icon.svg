<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#090d16" />
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="#090d16" />
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#ring)" stroke-width="14" stroke-dasharray="8 6" opacity="0.6" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#0ea5e9" stroke-width="4" opacity="0.4" />
  <circle cx="256" cy="256" r="12" fill="#38bdf8" />
  <!-- Atomic orbitals -->
  <ellipse cx="256" cy="256" rx="100" ry="36" fill="none" stroke="#38bdf8" stroke-width="4" transform="rotate(30 256 256)" opacity="0.7" />
  <ellipse cx="256" cy="256" rx="100" ry="36" fill="none" stroke="#10b981" stroke-width="4" transform="rotate(-30 256 256)" opacity="0.7" />
  <!-- Clock hands -->
  <line x1="256" y1="256" x2="256" y2="170" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
  <line x1="256" y1="256" x2="310" y2="256" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" />
  <line x1="256" y1="256" x2="210" y2="300" stroke="#ef4444" stroke-width="3" stroke-linecap="round" />
  <text x="256" y="430" font-family="monospace" font-size="28" font-weight="bold" fill="#38bdf8" text-anchor="middle" letter-spacing="4">CHRONOS</text>
</svg>
